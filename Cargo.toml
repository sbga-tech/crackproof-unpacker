[package]
name = "crackproof-unpacker"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
aes = "0.8"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
hex = "0.4"
indicatif = "0.18"
sha2 = "0.10"
rayon = "1.11"
tempfile = "3.20"
tracing = "0.1"
tracing-indicatif = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "registry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
libmwemu = "0.25.3"
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
perf = "deny"
suspicious = "deny"
